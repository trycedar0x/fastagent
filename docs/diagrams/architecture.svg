<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
<title id="title">Two parts: a local CLI and a standalone chat app</title>
<desc id="description">The CLI manages deployment. The deployed app handles chat without the CLI.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="900" fill="#fff"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#183153" text-anchor="start"><tspan x="50" y="62">Two parts: a local CLI and a standalone chat app</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="start"><tspan x="50" y="103">The CLI manages deployment. The deployed app handles chat without the CLI.</tspan></text>
<rect x="50" y="150" width="230" height="120" rx="12" fill="#e7f5ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183153" text-anchor="middle"><tspan x="165" y="205">Developer</tspan><tspan x="165" y="230">or coding assistant</tspan></text>
<rect x="385" y="150" width="260" height="120" rx="12" fill="#e7f5ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183153" text-anchor="middle"><tspan x="515" y="192.5">Fastagent CLI</tspan><tspan x="515" y="217.5">init / dev / deploy</tspan><tspan x="515" y="242.5">status / logs / check</tspan></text>
<rect x="880" y="150" width="270" height="120" rx="12" fill="#e7f5ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183153" text-anchor="middle"><tspan x="1015" y="192.5">Generated app files</tspan><tspan x="1015" y="217.5">Prompt + tools + config</tspan><tspan x="1015" y="242.5">fastagent.yaml</tspan></text>
<path d="M 292 210 L 373 210" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 657 210 L 868 210" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183153" text-anchor="start"><tspan x="690" y="191">create / manage</tspan></text>
<rect x="50" y="430" width="230" height="150" rx="12" fill="#e7f5ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183153" text-anchor="middle"><tspan x="165" y="487.5">Client</tspan><tspan x="165" y="512.5">Bearer token</tspan><tspan x="165" y="537.5">HTTP / NDJSON</tspan></text>
<rect x="385" y="415" width="260" height="180" rx="12" fill="#ebfbee" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="middle"><tspan x="515" y="478">Standalone chat app</tspan><tspan x="515" y="500.5">Your Railway / Cloud Run</tspan><tspan x="515" y="523">Chat API + history + tools</tspan><tspan x="515" y="545.5">Official OpenAI SDK</tspan></text>
<rect x="880" y="430" width="270" height="150" rx="12" fill="#fff9db" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183153" text-anchor="middle"><tspan x="1015" y="487.5">Your TLS Redis</tspan><tspan x="1015" y="512.5">App conversation history</tspan><tspan x="1015" y="537.5">7-day sliding expiry</tspan></text>
<rect x="385" y="720" width="260" height="110" rx="12" fill="#f3f0ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183153" text-anchor="middle"><tspan x="515" y="770">OpenAI API</tspan><tspan x="515" y="795">Model streaming</tspan></text>
<path d="M 1015 282 L 1015 330 L 515 330 L 515 403" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183153" text-anchor="start"><tspan x="550" y="311">deploy filtered source + configuration</tspan></text>
<path d="M 292 505 L 373 505" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#183153" text-anchor="start"><tspan x="292" y="475">HTTPS</tspan></text>
<path d="M 657 505 L 868 505" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183153" text-anchor="start"><tspan x="680" y="456">Read / commit / delete history</tspan><tspan x="680" y="476">Across instances + restarts</tspan></text>
<path d="M 515 607 L 515 708" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="start"><tspan x="550" y="668">Chat -&gt; model; streamed text -&gt; client</tspan><tspan x="550" y="690.5">Health checks do not call the model</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183153" text-anchor="start"><tspan x="50" y="877">Local dev uses memory history. Production fails closed during Redis outages; it never falls back to memory.</tspan></text>
</svg>
