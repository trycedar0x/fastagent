<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title description">
<title id="title">Separate runtime secrets from uploaded source</title>
<desc id="description">Deployment auto-detects .env and .env.auth (or use --env-file). Local dev loads them automatically.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="970" fill="#fff"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#183153" text-anchor="start"><tspan x="50" y="62">Separate runtime secrets from uploaded source</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="start"><tspan x="50" y="103">Deployment auto-detects .env and .env.auth (or use --env-file). Local dev loads them automatically.</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183153" text-anchor="start"><tspan x="50" y="146">IGNORED FILES ON YOUR MACHINE</tspan></text>
<rect x="50" y="170" width="300" height="105" rx="12" fill="#fff9db" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#183153" text-anchor="middle"><tspan x="200" y="217.75">.env</tspan><tspan x="200" y="241.5">Model key + Redis or ephemeral</tspan></text>
<rect x="50" y="320" width="300" height="105" rx="12" fill="#fff9db" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="middle"><tspan x="200" y="368">.env.auth</tspan><tspan x="200" y="390.5">FASTAGENT_API_TOKEN</tspan></text>
<rect x="50" y="470" width="300" height="105" rx="12" fill="#f3f0ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="middle"><tspan x="200" y="506.75">Railway only: .env.railway</tspan><tspan x="200" y="529.25">RAILWAY_API_TOKEN</tspan><tspan x="200" y="551.75">or scoped RAILWAY_TOKEN</tspan></text>
<rect x="50" y="620" width="300" height="105" rx="12" fill="#f3f0ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#183153" text-anchor="middle"><tspan x="200" y="667.75">Cloud Run only</tspan><tspan x="200" y="691.5">Native gcloud authentication</tspan></text>
<rect x="495" y="255" width="260" height="290" rx="12" fill="#e7f5ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="middle"><tspan x="625" y="361.75">Fastagent deploy</tspan><tspan x="625" y="384.25">--env-file optional (auto-detect)</tspan><tspan x="625" y="406.75">--auth-file: Railway token</tspan><tspan x="625" y="429.25">gcloud auth: Cloud Run</tspan><tspan x="625" y="451.75">Explicit provider settings</tspan></text>
<rect x="885" y="235" width="270" height="330" rx="12" fill="#ebfbee" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="middle"><tspan x="1020" y="339.25">Your chat app</tspan><tspan x="1020" y="361.75">Runtime configuration:</tspan><tspan x="1020" y="384.25">Model key</tspan><tspan x="1020" y="406.75">Bearer token</tspan><tspan x="1020" y="429.25">TLS Redis or ephemeral</tspan><tspan x="1020" y="451.75">APP_ORIGIN from the CLI</tspan><tspan x="1020" y="474.25">PORT from the platform</tspan></text>
<path d="M 362 222 L 430 222 L 430 315 L 483 315" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 362 372 L 483 372" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 362 522 L 430 522 L 430 450 L 483 450" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M 362 672 L 455 672 L 455 505 L 483 505" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M 767 390 L 873 390" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#183153" text-anchor="start"><tspan x="775" y="350">Runtime</tspan><tspan x="775" y="368.75">settings</tspan></text>
<rect x="495" y="680" width="260" height="110" rx="12" fill="#e7f5ff" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="middle"><tspan x="625" y="719.25">Separate source upload</tspan><tspan x="625" y="741.75">Allowlisted app files</tspan><tspan x="625" y="764.25">No .env files</tspan></text>
<rect x="885" y="680" width="270" height="110" rx="12" fill="#ebfbee" stroke="#183153" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="middle"><tspan x="1020" y="719.25">Cloud build</tspan><tspan x="1020" y="741.75">Builds the app image</tspan><tspan x="1020" y="764.25">No credentials in Dockerfile</tspan></text>
<path d="M 625 557 L 625 668" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183153" text-anchor="start"><tspan x="650" y="616">Filtered upload</tspan></text>
<path d="M 767 735 L 873 735" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1020 668 L 1020 577" fill="none" stroke="#183153" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183153" text-anchor="start"><tspan x="1045" y="626">Built app</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183153" text-anchor="start"><tspan x="50" y="853">Railway also exposes configured variables to its build infrastructure.</tspan><tspan x="50" y="875.5">Keeping secrets out of source uploads is NOT a runtime-only secrecy guarantee.</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183153" text-anchor="start"><tspan x="50" y="937">Use placeholders only in docs. Never commit credentials. Preview with --dry-run; get permission before a real deploy.</tspan></text>
</svg>
